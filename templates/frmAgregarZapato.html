{% include "encabezado.html" %}

<div class="col-md-6 offset-md-3">
    <h3 class="text-center mb-3">AGREGAR ZAPATO</h3>

    {% if mensaje %}
        <div class="alert alert-danger">{{ mensaje }}</div>
    {% endif %}

    <form action="/agregarZapato" method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label>Código:</label>
            <input type="number" name="txtCodigo" class="form-control" value="{{ zapato.get('codigo', '') }}" required>
        </div>
        <div class="mb-3">
            <label>Marca:</label>
            <input type="text" name="txtMarca" class="form-control" value="{{ zapato.get('marca', '') }}" required>
        </div>
        <div class="mb-3">
            <label>Modelo:</label>
            <input type="text" name="txtModelo" class="form-control" value="{{ zapato.get('modelo', '') }}" required>
        </div>
        <div class="mb-3">
            <label>Talla:</label>
            <input type="number" name="txtTalla" class="form-control" value="{{ zapato.get('talla', '') }}" required>
        </div>
        <div class="mb-3">
            <label>Precio:</label>
            <input type="number" name="txtPrecio" class="form-control" value="{{ zapato.get('precio', '') }}" required>
        </div>
        <div class="mb-3">
            <label>Categoría:</label>
            <select name="cbCategoria" class="form-select" required>
                <option value="DEPORTIVO">DEPORTIVO</option>
                <option value="URBANO">URBANO</option>
                <option value="FORMAL">FORMAL</option>
                <option value="BOTAS">BOTAS</option>
            </select>
        </div>
        <div class="mb-3">
            <label>Seleccione Foto (jpg):</label>
            <input type="file" name="fileFoto" class="form-control" accept=".jpg" required>
        </div>
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="/" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
